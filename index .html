<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIZTOK</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;height:100vh;overflow:hidden}
.feed{heigh:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100vh;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
.card video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:0 60px 20px 12px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.right{position:absolute;right:8px;bottom:90px;display:flex;flex-direction:column;gap:18px;align-items:center}
.ab{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff;border:none;font-size:22px}
.ab.active{color:#fe2c55}
.pb{width:48px;height:48px;border-radius:50%;border:2px solid #fff;overflow:hidden}
.pb img{width:100%;height:100%;object-fit:cover}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.nav{color:#888;display:flex;flex-direction:column;align-items:center;font-size:10px;background:none;border:none}
.nav.active{color:#fff}.nav i{font-size:22px}
.page{display:none;position:fixed;inset:0;background:#000;z-index:50;overflow-y:auto;padding-bottom:80px}
.page.active{display:block}
.preview{width:100%;height:380px;background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;border:2px dashed #333;overflow:hidden}
.preview video{width:100%;height:100%;object-fit:cover}
.avatar{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;background:#222;overflow:hidden;position:relative;border:3px solid #fe2c55}
.avatar img{width:100%;height:100%;object-fit:cover}
.wallet{background:linear-gradient(135deg,#fe2c55,#ff6b6b);padding:16px;border-radius:12px;margin:12px}
.heart{position:absolute;left:50%;top:50%;font-size:80px;color:#fe2c55;pointer-events:none;animation:pop.9s ease-out;z-index:10}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}15%{transform:translate(-50%,-50%) scale(1.2)}80%{opacity:1}100%{opacity:0}}
.ban{position:fixed;inset:0;background:#000;z-index:999;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}
.ban.show{display:flex}
.logo{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:90;font-weight:900;font-size:18px}
.logo span{color:#fe2c55}
input,select{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;margin:8px 0}
.btn{width:100%;background:#fe2c55;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:700;margin-top:12px}
.chip{padding:6px 14px;background:#222;border-radius:20px;border:1px solid #333;font-size:13px;margin-right:6px;display:inline-block}
.chip.active{background:#fe2c55;border-color:#fe2c55}
</style>
</head>
<body>
<div class="logo">PIZ<span>TOK</span></div>
<div id="feedPage" class="feed" style="display:flex;flex-direction:column"></div>
<div class="bottom">
<button class="nav active" onclick="showP('feed')"><i class="fa-solid fa-house"></i>Home</button>
<button class="nav" onclick="showP('discover')"><i class="fa-solid fa-magnifying-glass"></i>Discover</button>
<button class="nav" onclick="document.getElementById('fileInput').click()"><div style="width:48px;height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000"><i class="fa-solid fa-plus"></i></div></button>
<button class="nav" onclick="showP('inbox')"><i class="fa-solid fa-inbox"></i>Inbox</button>
<button class="nav" onclick="showP('profile')"><i class="fa-regular fa-user"></i>Profile</button>
</div>
<input type="file" id="fileInput" accept="video/*" style="display:none" onchange="handleV(event)">
<div id="discoverPage" class="page"><div style="padding:60px 16px"><h2>Discover</h2></div></div>
<div id="inboxPage" class="page"><div style="padding:60px 16px"><h2>Inbox</h2><div id="inboxList"></div></div></div>
<div id="profilePage" class="page"><div style="padding-top:60px;text-align:center"><div class="avatar" onclick="document.getElementById('avatarInput').click()"><img id="myAvatar" src="https://i.pravatar.cc/200"><div style="position:absolute;bottom:0;right:0;background:#fe2c55;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-camera" style="font-size:12px"></i></div></div><input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleA(event)"><h3>Piztok User</h3><div style="display:flex;justify-content:center;gap:20px;margin:14px 0"><div><b id="fc">0</b><br><small>Videos</small></div><div><b>1.2K</b><br><small>Followers</small></div><div><b id="lc">0</b><br><small>Likes</small></div></div><div class="wallet"><small>Wallet</small><h2>₦100.00</h2></div><div id="myGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:16px"></div></div></div>
<div id="uploadPage" class="page"><div style="padding:50px 16px"><h2>Upload 🔊</h2><div class="preview" id="previewBox"><span>Select video with sound</span><video id="pv" playsinline loop style="display:none"></video></div><div id="filterRow" style="padding:10px 0;white-space:nowrap;overflow-x:auto"></div><input id="cap" placeholder="Add caption..."><select id="fsel" onchange="applyF()"><option value="none">Original</option><option value="grayscale(1)">Gray</option><option value="sepia(1)">Sepia</option><option value="contrast(1.5) saturate(1.5)">Vivid</option><option value="brightness(1.2) saturate(1.3)">Bright</option><option value="hue-rotate(90deg)">Green</option><option value="hue-rotate(180deg)">Blue</option><option value="blur(1px) brightness(1.1)">Soft</option><option value="contrast(1.2) sepia(0.5)">Retro</option></select><div style="display:flex;gap:8px"><button class="btn" style="background:#222;flex:1" onclick="showP('feed')">Cancel</button><button class="btn" style="flex:2" onclick="publish()">Post with Sound 🔊</button></div></div></div>
<div id="bannedScreen" class="ban"><div><h2>You have been removed</h2><p id="banR"></p><button class="btn" onclick="localStorage.clear();location.reload()">Reset</button></div></div>
<script>
const filters=["none","grayscale(1)","sepia(1)","contrast(1.5) saturate(1.5)","brightness(1.2) saturate(1.3)","hue-rotate(90deg)","hue-rotate(180deg)","blur(1px) brightness(1.1)","contrast(1.2) sepia(0.5)"];
let sf=null,sfil="none",vids=[],likes={},lt=0;
function init(){
let s=localStorage.getItem('piztok_videos');if(s)vids=JSON.parse(s);
let av=localStorage.getItem('piztok_avatar');if(av)document.getElementById('myAvatar').src=av;
render();
let row=document.getElementById('filterRow');
filters.forEach((f,i)=>{
let lab=['Original','Gray','Sepia','Vivid','Bright','Green','Cool','Soft','Retro'][i];
let d=document.createElement('div');d.className='chip'+(i==0?' active':'');d.innerText=lab;
d.onclick=()=>{document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));d.classList.add('active');sfil=f;applyF()};
row.appendChild(d)
});
}
function showP(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('feedPage').style.display=p==='feed'?'flex':'none';if(p!=='feed')document.getElementById(p+'Page').classList.add('active');if(p==='feed')render();if(p==='profile')renderMy()}
function handleA(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.getElementById('myAvatar').src=r.result;localStorage.setItem('piztok_avatar',r.result)};r.readAsDataURL(f)}
function handleV(e){let f=e.target.files[0];if(!f)return;sf=f;showP('upload');let u=URL.createObjectURL(f);let v=document.getElementById('pv');v.src=u;v.style.display='block';v.muted=false;v.volume=1;v.play();document.getElementById('previewBox').querySelector('span').style.display='none'}
function applyF(){document.getElementById('pv').style.filter=sfil;document.getElementById('fsel').value=sfil}
function publish(){if(!sf){alert('Select video');return}let cap=document.getElementById('cap').value||'My PIZTOK 🔥';let r=new FileReader();r.onload=()=>{vids.unshift({id:Date.now(),src:r.result,caption:cap,filter:sfil,likes:0,user:'Piztok User',avatar:document.getElementById('myAvatar').src,time:'now'});localStorage.setItem('piztok_videos',JSON.stringify(vids));alert('Posted!');sf=null;showP('feed');render()};r.readAsDataURL(sf)}
function render(){
let feed=document.getElementById('feedPage');feed.innerHTML='';
let all=[...vids,{id:1,src:'https://www.w3schools.com/html/mov_bbb.mp4',caption:'Welcome! Sound 🔊 works! Double tap ❤️',filter:'none',likes:245,user:'Piztok Official',avatar:'https://i.pravatar.cc/150?img=12',time:'1h'}];
all.forEach(v=>{
let c=document.createElement('div');c.className='card';
c.innerHTML=`<video src="${v.src}" loop playsinline style="filter:${v.filter}"></video><div class="right"><div class="pb"><img src="${v.avatar}"></div><button class="ab" onclick="likeV(${v.id})"><i class="fa-regular fa-heart"></i><small>${v.likes}</small></button><button class="ab" onclick="alert('Share')"><i class="fa-solid fa-share"></i></button></div><div class="overlay"><h4>${v.user}</h4><p>${v.caption}</p><p style="font-size:12px"><i class="fa-solid fa-music"></i> Original sound 🔊</p></div>`;
c.addEventListener('dblclick',()=>doH(c,v.id));
let ve=c.querySelector('video');ve.addEventListener('click',()=>{let n=Date.now();if(n-lt<300)doH(c,v.id);lt=n;if(ve.paused)ve.play();else ve.pause()});
feed.appendChild(c)
});
let obs=new IntersectionObserver(es=>{es.forEach(en=>{let vd=en.target.querySelector('video');if(en.isIntersecting){vd.play();vd.muted=false}else vd.pause()})},{threshold:.7});
document.querySelectorAll('.card').forEach(c=>obs.observe(c));
}
function doH(card,id){let h=document.createElement('div');h.className='heart';h.innerHTML='<i class="fa-solid fa-heart"></i>';card.appendChild(h);setTimeout(()=>h.remove(),900);if(!likes[id]){likes[id]=true;render()}}
function likeV(id){likes[id]=!likes[id];render()}
function renderMy(){let g=document.getElementById('myGrid');g.innerHTML='';vids.forEach(v=>{let d=document.createElement('div');d.style.cssText='height:160px;background:#111;overflow:hidden';d.innerHTML=`<video src="${v.src}" style="width:100%;height:100%;object-fit:cover;filter:${v.filter}" muted></video>`;g.appendChild(d)})}
init();
</script>
</body>
</html>
